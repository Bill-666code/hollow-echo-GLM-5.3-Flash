<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>空洞余响 · Hollow Echo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #04060b; overflow: hidden; height: 100%; }
  canvas { display: block; }
  #err {
    position: fixed; left: 8px; bottom: 8px; max-width: 90vw;
    color: #ff9a9a; font: 12px/1.5 monospace; white-space: pre-wrap;
    pointer-events: none; text-shadow: 0 1px 2px #000; z-index: 9;
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="err"></div>
<script>
  window.onerror = function (msg, src, line) {
    document.getElementById('err').textContent = msg + ' @' + (src || '').split('/').pop() + ':' + line;
  };
</script>
<script src="js/core.js?v=1"></script>
<script src="js/audio.js?v=1"></script>
<script src="js/rooms.js?v=1"></script>
<script src="js/entities.js?v=1"></script>
<script src="js/bosses.js?v=1"></script>
<script src="js/main.js?v=1"></script>
</body>
</html>
